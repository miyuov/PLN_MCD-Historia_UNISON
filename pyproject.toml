[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pln_historia_unison"
version = "0.0.1"
description = "Procesamiento de Lenguaje Natural aplicado a documentos historicos de la Universidad de Sonora."
authors = [
  { name = "Equipo PLN Historia Unison" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pyarrow>=26.0.0",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tabulate>=0.10.0",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["pln_historia_unison", "src", "tests"]
include = [
  "pyproject.toml",
  "pln_historia_unison/**/*.py",
  "src/**/*.py",
  "tests/**/*.py",
]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["pln_historia_unison"]
force-sort-within-sections = true

